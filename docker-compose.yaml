services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Preencha POSTGRES_PASSWORD no .env local}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - fortsul-db-data:/var/lib/postgresql/data
    networks:
      - fortsul-internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # A aplicação usa a role com menor privilégio; seed e expurgo mantêm a
      # role migradora para tarefas administrativas controladas.
      DATABASE_URL: postgresql://${POSTGRES_APP_USER:-fortsul_app}:${POSTGRES_APP_PASSWORD:?Preencha POSTGRES_APP_PASSWORD no .env local}@db:5432/${POSTGRES_DB}
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:-postgresql}
      DATABASE_PLATFORM: ${DATABASE_PLATFORM:-local}
      AUTH_SECRET: ${AUTH_SECRET:?Preencha AUTH_SECRET no .env local}
      AUTH_ORIGIN: ${AUTH_ORIGIN:?Preencha AUTH_ORIGIN no .env local}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:?Preencha AUTH_TRUST_HOST no .env local}
      MFA_CODE_PEPPER: ${MFA_CODE_PEPPER:?Preencha MFA_CODE_PEPPER no .env local}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:?Preencha AUTH_COOKIE_SECURE no .env local}
      SECURITY_HEADERS_HSTS: ${SECURITY_HEADERS_HSTS:-false}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./prisma:/app/prisma
      - ./src:/app/src
      - ./vitest.config.ts:/app/vitest.config.ts
      - ./vitest.setup.ts:/app/vitest.setup.ts
      - ./tsconfig.json:/app/tsconfig.json
      - ./next-env.d.ts:/app/next-env.d.ts
    networks:
      - fortsul-internal

  # Ferramenta manual: não inicia com `docker compose up`.
  # Ela existe só para criar o primeiro administrador local de teste.
  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: ["npx", "prisma", "db", "seed"]
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
      ADMIN_SEED_RESET_PASSWORD: ${ADMIN_SEED_RESET_PASSWORD:-false}
      SEED_ADMIN_REQUIRED: "true"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fortsul-internal

  # Rotina autônoma: executa o expurgo ao iniciar e depois uma vez a cada
  # intervalo configurado. No ambiente real, manter o padrão diário.
  purge-security-data:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        while true; do
          npm run purge:security
          sleep "$${SECURITY_PURGE_INTERVAL_SECONDS:-86400}"
        done
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECURITY_PURGE_INTERVAL_SECONDS: ${SECURITY_PURGE_INTERVAL_SECONDS:-86400}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fortsul-internal

networks:
  fortsul-internal:
    driver: bridge

volumes:
  fortsul-db-data:
